<!doctype html>
<html lang="en">
<head>
  <!-- dry._layout.head /-->
  <title>Become a member</title>
</head>
<body>
  <!-- dry._layout.header /-->
  <main class="narrow">
    <h1>Become a member</h1>
    <!-- print.validation.alert('email_taken') --><p class="error">There is already an account with that email.</p><!-- /print.validation.alert('email_taken') -->
    <!-- print.validation.alert('email_invalid') --><p class="error">That email does not look right.</p><!-- /print.validation.alert('email_invalid') -->
    <!-- print.validation.alert('password_short') --><p class="error">Use at least 8 characters.</p><!-- /print.validation.alert('password_short') -->
    <!-- render.authentication.register -->
    <form method="post" class="stack">
      <label>Name <input type="text" name="name" maxlength="100"></label>
      <label>Email <input type="email" name="email" required></label>
      <!-- render.validation.field('email') --><p class="error">Enter a valid email address.</p><!-- /render.validation.field('email') -->
      <label>Password <input type="password" name="password" required minlength="8"></label>
      <!-- render.validation.field('password') --><p class="error">Use at least 8 characters.</p><!-- /render.validation.field('password') -->
      <label>Again <input type="password" name="password_again" required></label>
      <!-- render.validation.matches('password', 'password_again') --><p class="error">The passwords are different.</p><!-- /render.validation.matches('password', 'password_again') -->
      <button>Join</button>
    </form>
    <!-- /render.authentication.register -->
  </main>
  <!-- dry._layout.footer /-->
</body>
</html>
