<!doctype html>
<html lang="en">
<head>
  <!-- dry._layout.head /-->
  <title>Create an account</title>
</head>
<body>
  <!-- dry._layout.header /-->
  <main class="narrow">
    <h1>Create an account</h1>
    <!-- print.validation.alert('email_taken') --><p class="error">There is already an account with that email. <a href="login.html">Log in</a> instead?</p><!-- /print.validation.alert('email_taken') -->
    <!-- print.validation.alert('password_short') --><p class="error">Use at least 8 characters for your password.</p><!-- /print.validation.alert('password_short') -->
    <!-- render.authentication.register -->
    <form method="post" class="stack">
      <label>Name <input type="text" name="name" autocomplete="name" maxlength="100"></label>
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
      <!-- render.validation.field('email') --><p class="error">Enter a valid email address.</p><!-- /render.validation.field('email') -->
      <label>Password <input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
      <!-- render.validation.field('password') --><p class="error">Use at least 8 characters.</p><!-- /render.validation.field('password') -->
      <label>Password again <input type="password" name="password_again" autocomplete="new-password" required></label>
      <!-- render.validation.matches('password', 'password_again') --><p class="error">The passwords are different.</p><!-- /render.validation.matches('password', 'password_again') -->
      <button>Create account</button>
    </form>
    <!-- /render.authentication.register -->
  </main>
  <!-- dry._layout.footer /-->
</body>
</html>
