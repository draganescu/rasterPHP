<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5">
  <p>Hi <!-- print.self.name -->there<!-- /print.self.name -->,</p>
  <p>Someone asked to reset the password for your account. If it was you, choose a new one here (the link works for an hour):</p>
  <p><a href="<!-- print.self.reset_url /-->">Choose a new password</a></p>
  <p>If it wasn't you, ignore this email; your password stays the same.</p>
</body>
</html>
